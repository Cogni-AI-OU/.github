---
# Ansible playbook file.
# Usage: ansible-playbook .devcontainer/provision.yml
# Note: Keep keys and lists in alphabetical order.
- name: Provision dev container
  hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Load apt packages from file
      ansible.builtin.set_fact:
        apt_packages: >-
          {{ lookup('file', playbook_dir + '/apt-packages.txt').splitlines()
          | map('trim') | reject('equalto', '') | reject('match', '^#') | list }}
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
    - name: Install apt packages
      ansible.builtin.apt:
        name: '{{ apt_packages }}'
        state: present
    - name: Install ansible via pipx
      ansible.builtin.command:
        argv:
          - pipx
          - install
          - --include-deps
          - ansible
      args:
        creates: '{{ ansible_env.HOME }}/.local/bin/ansible'
      become: false
    - name: Inject ansible python requirements
      ansible.builtin.command:
        argv:
          - pipx
          - inject
          - ansible
          - -r
          - '{{ playbook_dir }}/requirements-ansible.txt'
      become: false
      register: pipx_inject
      changed_when: >-
        'already' not in (pipx_inject.stdout + pipx_inject.stderr | lower)
      failed_when: pipx_inject.rc != 0
    - name: Install python requirements
      ansible.builtin.pip:
        requirements: '{{ playbook_dir }}/requirements.txt'
        extra_args: --break-system-packages --user
        state: present
      become: false
    - name: Ensure ~/.local/bin is in PATH for user-installed CLIs (pre-commit, uv, etc.)
      ansible.builtin.lineinfile:
        path: '{{ ansible_env.HOME }}/.bashrc'
        line: 'export PATH="$HOME/.local/bin:$PATH"'
        state: present
        insertafter: EOF
        create: true
      become: false
      when: ansible_env.HOME is defined
    - name: Install pre-commit hooks
      ansible.builtin.command:
        argv:
          - pre-commit
          - install
      args:
        chdir: '{{ playbook_dir }}/..'
        creates: .git/hooks/pre-commit
      become: false

    - name: Install all Cogni AI skills
      ansible.builtin.command:
        argv:
          - gh
          - skill
          - install
          - Cogni-AI-OU/cogni-ai-agent-skills
          - --all
          - --force
          - --scope
          - user
      become: false
      register: skills_install
      changed_when: >-
        'already installed' not in ((skills_install.stdout + skills_install.stderr) | lower)
      failed_when: skills_install.rc != 0
